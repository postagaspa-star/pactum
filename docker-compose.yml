# Pactum — il postino sul NAS (Docker Compose).
#
# Due container:
#   pactum    -> il server (il "postino")
#   tailscale -> gli da un indirizzo pubblico https FISSO, senza aprire porte
#                sul router e senza comprare domini
#
# Guida passo-passo: docs/deploy-nas-ugreen.md
#
# Il registro della famiglia vive nel volume "pactum-data": NON si tocca a mano
# e sopravvive a riavvii e aggiornamenti. Gli APK firmati stanno in server/apk.

services:
  pactum:
    build:
      context: ./server          # il Dockerfile sta in server/Dockerfile
      dockerfile: Dockerfile
    image: pactum-postino:latest
    container_name: pactum
    restart: unless-stopped
    expose:
      - "8000"                   # visibile a tailscale sulla rete interna di Docker
    ports:
      - "8100:8000"              # e anche sulla LAN di casa (http://IP-NAS:8100), per le verifiche.
                                 # Non la 8000: sul NAS e' gia' occupata da NormaAI (legal-rag).
    env_file:
      - ./server/.env            # token veri e opzioni (gitignorato)
    environment:
      # Fissati qui a prescindere dal .env: in produzione devono valere sempre.
      PACTUM_ENV: prod           # con token deboli il postino RIFIUTA di partire
      PACTUM_DB: /data/pactum.db # database sul volume persistente
      PACTUM_APK_DIR: /apk       # APK serviti da /scarica
    volumes:
      - pactum-data:/data        # volume Docker: il registro persiste
      - ./server/apk:/apk        # cartella host: gli APK firmati
      - ./server/backup:/backup  # cartella host: le copie del registro

  # Tailscale Funnel: indirizzo pubblico https STABILE (es.
  # https://pactum.tuo-nome.ts.net), gratuito, senza aprire porte sul router.
  # A differenza del vecchio tunnel Cloudflare "veloce", questo indirizzo NON
  # cambia mai: si configura una volta nelle app e non ci si pensa piu'.
  #
  # Serve una chiave d'accesso (TS_AUTHKEY) in server/.env — v. la guida.
  # userspace-networking: niente /dev/net/tun, niente privilegi speciali, cosi'
  # gira anche dove il NAS non concede capacita' di rete estese.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: pactum-tailscale
    restart: unless-stopped
    env_file:
      - ./server/.env            # qui dentro TS_AUTHKEY
    environment:
      # Nome nell'indirizzo pubblico (pactum.<tailnet>.ts.net). NON usare
      # "hostname: pactum" sul container: dentro di lui il nome "pactum"
      # punterebbe a se stesso invece che al server, e il ponte darebbe 502.
      TS_HOSTNAME: pactum
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/funnel.json   # espone pactum:8000 al pubblico
    volumes:
      - tailscale-state:/var/lib/tailscale   # l'identita' del nodo: va persistita
      - ./tailscale:/config                  # funnel.json (in questo repo)
    depends_on:
      - pactum

volumes:
  pactum-data:                   # il registro del patto
  tailscale-state:               # l'identita' Tailscale del NAS
